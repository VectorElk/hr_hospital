<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">HR Hospital</title>
  <desc id="desc">Hospital management addon banner with a medical cross and module title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#875a7b"/>
      <stop offset="100%" stop-color="#4d7ea8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="120" cy="150" r="78" fill="rgba(255,255,255,0.18)"/>
  <rect x="99" y="105" width="42" height="90" rx="8" fill="#ffffff"/>
  <rect x="75" y="129" width="90" height="42" rx="8" fill="#ffffff"/>
  <text x="240" y="128" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#ffffff">HR Hospital</text>
  <text x="240" y="182" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="rgba(255,255,255,0.92)">Patient, doctor, visit, report, and access management for Odoo School</text>
